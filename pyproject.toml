[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceops-fde-sandbox"
version = "1.0.0"
description = "Bilingual (TR/EN) voice + text customer-support agent sandbox for Forward Deployed Engineering demos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tzdata",
    "websockets>=13",
    "pyyaml>=6",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
anthropic = ["anthropic"]
voice-local = ["faster-whisper>=1.0"]

[tool.setuptools.packages.find]
include = ["voiceops*"]

[tool.setuptools.package-data]
voiceops = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
