# Alembic owns the agent's schema in deployed environments (Docker Compose runs
# `alembic upgrade head` before the API starts). Local dev and tests create tables
# directly (DB_AUTO_CREATE=true). The mock systems are not migrated: they stand in
# for external systems and are recreated from the seed.
#
# The database URL comes from DATABASE_URL (see migrations/env.py), never from this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
